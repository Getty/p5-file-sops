[@Author::GETTY]
; .claude/ and CLAUDE.md are NOT excluded: this distribution discloses how it
; was built, so the agent setup ships with it. .gitignore is what keeps
; credentials, session state and machine-local overrides out -- Git::GatherDir
; ships tracked files only.
;
; Repo-only material below. Git::GatherDir ships every tracked file, so anything
; that belongs to development rather than to the distribution has to be excluded
; explicitly or it silently joins the CPAN tarball.
gather_exclude_match = ^docs/
; Drafts of reports to other projects' trackers, kept for their measurements.
; Not the karr board -- that lives in refs/karr/* as real git refs, which are
; not working-tree files and never reach Git::GatherDir at all.
gather_exclude_match = ^refs/
