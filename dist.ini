[@Author::GETTY]
; Repo-only material. Git::GatherDir ships every tracked file, so anything that
; belongs to development rather than to the distribution has to be excluded
; explicitly or it silently joins the CPAN tarball.
gather_exclude_match = ^\.claude/
gather_exclude_match = ^docs/
gather_exclude_match = ^CLAUDE\.md$
